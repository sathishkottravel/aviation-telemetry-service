# Caddy + Jaeger for the VM, on the shared Docker network "edge". Set up with ./setup-infra.sh (see README.md).
#
# Caddy runs your own /etc/caddy config. On "edge" it reaches containers by name (jaeger:16686, aviation-api:8000);
# apps running directly on the VM are host.docker.internal:<port>. Only Caddy publishes ports.
name: infra

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      # Optional: environment variables your Caddyfile uses ({$VAR}).
      - path: ./caddy.env
        required: false
    volumes:
      - /etc/caddy:/etc/caddy:ro
      # Reuse the host Caddy's certificates and ACME account, so nothing is re-issued.
      - ${CADDY_DATA_DIR:-/var/lib/caddy/.local/share/caddy}:/data/caddy
      - caddy-config:/config
    networks: [edge]
    restart: unless-stopped
    logging: *logging

  # One-shot: Jaeger runs as uid 10001, but a new volume is owned by root.
  jaeger-init:
    image: busybox:1.37
    command: ["chown", "-R", "10001:0", "/badger"]
    volumes:
      - jaeger-data:/badger

  # Kept small for the VM (README.md → Lean settings). Storage: Badger on disk (default) or, with
  # JAEGER_CONFIG=jaeger-config.memory.yaml, a capped in-memory store.
  jaeger:
    image: jaegertracing/jaeger:2.21.0
    mem_limit: 384m
    cpus: 0.75
    environment:
      # Go's soft heap limit (~80% of mem_limit): the GC works harder near it instead of hitting the OOM killer.
      GOMEMLIMIT: 300MiB
      GOMAXPROCS: "1"
    command: ["--config", "/etc/jaeger/${JAEGER_CONFIG:-jaeger-config.yaml}"]
    volumes:
      - ./jaeger-config.yaml:/etc/jaeger/jaeger-config.yaml:ro
      - ./jaeger-config.memory.yaml:/etc/jaeger/jaeger-config.memory.yaml:ro
      - ./jaeger-ui.json:/etc/jaeger/jaeger-ui.json:ro
      - jaeger-data:/badger
    depends_on:
      jaeger-init:
        condition: service_completed_successfully
    networks:
      edge:
        aliases: [jaeger]   # UI jaeger:16686, OTLP jaeger:4318 (HTTP) / jaeger:4317 (gRPC)
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:13133/status"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *logging

networks:
  edge:
    external: true

volumes:
  caddy-config:
  jaeger-data:

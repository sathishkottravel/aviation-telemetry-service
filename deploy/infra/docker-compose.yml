# Caddy in Docker, running your existing /etc/caddy config unchanged. Set up with ./setup-caddy.sh (see README.md).
#
# network_mode: host → inside the container "localhost" is the VM itself, so every `reverse_proxy localhost:PORT`
# in your Caddyfile keeps working as it did with the Caddy installed on the host.
name: caddy

services:
  caddy:
    image: caddy:2
    network_mode: host
    restart: unless-stopped
    env_file:
      # Optional: environment variables your Caddyfile uses ({$VAR}), e.g. copied from the old systemd unit.
      - path: ./caddy.env
        required: false
    volumes:
      - /etc/caddy:/etc/caddy:ro
      # Reuse the host Caddy's certificates and ACME account, so nothing is re-issued.
      - ${CADDY_DATA_DIR:-/var/lib/caddy/.local/share/caddy}:/data/caddy
      - caddy-config:/config
      # Add a line for any other host path your Caddyfile uses, e.g.:
      # - /var/www:/var/www:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy-config:

# Jaeger v2 (all-in-one) with a small in-memory store: no disk, smallest footprint, traces lost on restart.
# Receives OTLP on 4317 (gRPC) and 4318 (HTTP), serves the UI/API on 16686. All ports are internal to the
# Docker network "edge"; Caddy exposes the UI and the token-protected OTLP ingest.
# Select it with JAEGER_CONFIG=jaeger-config.memory.yaml; the default is jaeger-config.yaml (Badger on disk).
service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [jaeger_storage_exporter]
  telemetry:
    # No self-metrics endpoint/pipeline; only warnings and errors in the logs.
    metrics:
      level: none
    logs:
      level: warn

extensions:
  healthcheckv2:
    use_v2: true
    http:
      endpoint: 0.0.0.0:13133

  jaeger_query:
    storage:
      traces: memory_store
    max_clock_skew_adjust: 0s
    ui:
      config_file: /etc/jaeger/jaeger-ui.json
    http:
      endpoint: 0.0.0.0:16686

  jaeger_storage:
    backends:
      memory_store:
        memory:
          # Oldest traces are evicted beyond this count.
          max_traces: 2000

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 4
      http:
        endpoint: 0.0.0.0:4318
        max_request_body_size: 4194304

processors:
  # Refuses spans when the heap nears the limit (senders retry or drop; the services keep working).
  # Keep below GOMEMLIMIT and mem_limit in docker-compose.yml.
  memory_limiter:
    check_interval: 1s
    limit_mib: 250
    spike_limit_mib: 50
  batch:
    send_batch_size: 256
    send_batch_max_size: 512
    timeout: 2s

exporters:
  jaeger_storage_exporter:
    trace_storage: memory_store

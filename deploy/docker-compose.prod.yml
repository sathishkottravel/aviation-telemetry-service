# Backend services on the production VM (deployed by .github/workflows/deploy.yml via remote-deploy.sh).
#
# The api listens on 127.0.0.1:8000 only; the VM's Caddy (deploy/infra) proxies api.sathishkottravel.com to it.
# worker and producer publish nothing. MongoDB, RabbitMQ and the trace ingest (otel.*) are external; all
# settings come from .env on the VM (template: .env.prod.example). See deploy/README.md.
name: aviation

x-backend: &backend
  env_file: .env
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  api:
    <<: *backend
    image: ghcr.io/sathishkottravel/aviation-telemetry-service/api:${IMAGE_TAG:?set IMAGE_TAG}
    environment:
      OTEL_SERVICE_NAME: flight-telemetry-api
      PRODUCER_URL: http://producer:8001
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    <<: *backend
    image: ghcr.io/sathishkottravel/aviation-telemetry-service/worker:${IMAGE_TAG:?set IMAGE_TAG}
    environment:
      OTEL_SERVICE_NAME: flight-telemetry-worker

  producer:
    <<: *backend
    image: ghcr.io/sathishkottravel/aviation-telemetry-service/producer:${IMAGE_TAG:?set IMAGE_TAG}
    environment:
      OTEL_SERVICE_NAME: flight-telemetry-producer
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

[project]
name = "adsb-producer"
version = "0.1.0"
description = "Polls ADSB.lol for tracked aircraft and publishes normalized telemetry to RabbitMQ; controlled over HTTP"
requires-python = ">=3.12"
dependencies = [
    "telemetry-shared",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[tool.uv.sources]
telemetry-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adsb_producer"]

[project]
name = "telemetry-shared"
version = "0.1.0"
description = "Models, configuration, MongoDB and RabbitMQ helpers shared by the API service and telemetry worker"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=9.4",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pymongo>=4.13",
]

[project.scripts]
seed-db = "telemetry_shared.database.seed:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["telemetry_shared"]

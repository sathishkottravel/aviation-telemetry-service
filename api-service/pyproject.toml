[project]
name = "api-service"
version = "0.1.0"
description = "FastAPI + Strawberry GraphQL API: flight queries, telemetry history, live subscriptions and ingest"
requires-python = ">=3.12"
dependencies = [
    "telemetry-shared",
    "fastapi>=0.115",
    "strawberry-graphql[fastapi]>=0.243",
    "uvicorn[standard]>=0.30",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
]

[tool.uv.sources]
telemetry-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api_service"]
